name: Runway
options:
  bundleIdPrefix: com.danjun01
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here or in Xcode (Signing & Capabilities) to run on a device.
    DEVELOPMENT_TEAM: ""
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    from: 6.5.5
targets:
  Runway:
    type: application
    platform: iOS
    sources: [Runway]
    dependencies:
      - package: LinkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danjun01.runway
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        # Where the backend lives. The simulator can reach your Mac at localhost.
        RUNWAY_API_BASE_URL: http://localhost:8787
    info:
      path: Runway/Info.plist
      properties:
        CFBundleDisplayName: Runway
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        RunwayAPIBaseURL: $(RUNWAY_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Background refresh keeps the daily summary notification current.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.danjun01.runway.refresh]
  RunwayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunwayTests]
    dependencies:
      - target: Runway
schemes:
  Runway:
    build:
      targets:
        Runway: all
        RunwayTests: [test]
    test:
      targets: [RunwayTests]
